[package]
name = "rust-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Applies to any --release build, but in practice that's only build-wasm.sh
# (`cargo test`/`cargo build` here are always plain, non-release dev builds).
[profile.release]
opt-level = "z"   # optimize for size, not speed — the game logic here is tiny either way
lto = true
codegen-units = 1
panic = "abort"   # drops unwinding tables; nothing in this crate catches a panic
